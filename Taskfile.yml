version: '3'

vars:
  APP_NAME: "meal-cycle"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  seed:
    summary: Inserts sample recipes into the local SQLite DB (idempotent)
    cmds:
      - go run ./cmd/seed {{.CLI_ARGS}}

  test:unit:
    summary: Runs the Vitest unit tests for frontend pure functions and hooks
    desc: Runs the Vitest unit tests for frontend pure functions and hooks
    dir: frontend
    cmds:
      - npm run test

  test:e2e:
    summary: Runs the Playwright E2E suite (real React + Go services + SQLite)
    dir: frontend
    cmds:
      - npm run type-check
      - npm run test:e2e

  build:win:
    summary: WSL→Windows 手動確認用ビルド (CLAUDE.md 動作確認 2 階建て構成)
    desc: |
      frontend build → wails3 generate bindings → Windows amd64 cross-compile。
      repo root に meal-cycle.exe (.gitignore 対象) を出力する。
      WIN_DEST を渡すとビルド後にコピーする
      (例: task build:win WIN_DEST=/mnt/c/Users/yourname/Desktop/)。
    vars:
      WIN_DEST: '{{.WIN_DEST | default ""}}'
    cmds:
      - task: build:win:frontend
      - wails3 generate bindings
      - GOOS=windows GOARCH=amd64 go build -tags production -trimpath -ldflags="-w -s" -o meal-cycle.exe ./
      - task: build:win:copy
        vars:
          WIN_DEST: '{{.WIN_DEST}}'

  build:win:frontend:
    internal: true
    dir: frontend
    cmds:
      - npm run build

  build:win:copy:
    internal: true
    # WIN_DEST が空なら up-to-date 判定でスキップする (コピー先未指定時の no-op)
    status:
      - test -z "{{.WIN_DEST}}"
    cmds:
      - cp meal-cycle.exe "{{.WIN_DEST}}"

  lint:
    summary: Runs linters for both Go (golangci-lint) and frontend (Biome)
    cmds:
      - task: lint:go
      - task: lint:frontend

  lint:go:
    summary: Runs golangci-lint on Go code (skips build/ios, build/android)
    cmds:
      - go tool golangci-lint run ./internal/... ./cmd/... ./

  lint:frontend:
    summary: Runs Biome check (lint + format check) on frontend
    dir: frontend
    cmds:
      - npm run lint

  format:
    summary: Formats Go (gofmt/goimports via golangci-lint) and frontend (Biome)
    cmds:
      - task: format:go
      - task: format:frontend

  format:go:
    summary: Formats Go code via golangci-lint fmt
    cmds:
      - go tool golangci-lint fmt ./internal/... ./cmd/... ./

  format:frontend:
    summary: Formats frontend code and applies safe lint fixes via Biome
    dir: frontend
    cmds:
      - npm run lint:fix

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
